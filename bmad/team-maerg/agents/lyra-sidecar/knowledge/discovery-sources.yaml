# Lyra Discovery Sources — curated source URLs for activity discovery
# Per L5 + Q6 lock: V1 = Maerg-curated source list + light web-fetch automation per *weekly-plan / *find.
# V2 = canonical API integrations (Eventbrite, Resy, OpenTable, Ticketmaster, museum APIs) — own *evolve-agent ADR cycle.
#
# Schema:
#   regions:
#     <region-name>:
#       <category | "aggregators">:
#         - url: <source-url>
#           name: <human-readable name>
#           fetch_format: <html | rss | json>  # parsing hint
#           covers: [<categories>]              # only on aggregators — multi-category coverage list
#           last_fetched: <ISO date>            # populated by Lyra after web-fetch
#           last_fetch_status: <success | failed | rate-limited>
#
# Maerg adds via *add-source <category> <url>; Lyra fetches via *weekly-plan / *find on cadence.
# Fetch failures log to memories-autonomous-log.md ## fetch-failures.
#
# Schema note (added 2026-05-05): single-venue sources sit under their specific category
# (e.g., istanbulmodern.org under museums). Multi-category aggregators sit under the
# special "aggregators" key with a covers: [list] field naming the categories they span.

regions:
  istanbul:
    museums:
      - url: https://istanbulmodern.org
        name: Istanbul Modern
        fetch_format: html
        last_fetched: null
        last_fetch_status: null

    live_music:
      - url: https://www.nardisjazz.com/
        name: Nardis Jazz Club
        fetch_format: html
        last_fetched: null
        last_fetch_status: null

    aggregators:
      - url: https://kultur.istanbul/etkinlikler/
        name: Kültür İstanbul (city events portal)
        fetch_format: html
        covers: [museums, theatre, live_music, opera, dancing_events, workshops]
        last_fetched: null
        last_fetch_status: null

      - url: https://www.zorlupsm.com/etkinlikler
        name: Zorlu PSM
        fetch_format: html
        covers: [theatre, opera, live_music, dancing_events]
        last_fetched: null
        last_fetch_status: null

      - url: https://biletinial.com/tr-tr/sehrineozel/istanbul-avrupa
        name: Biletinial — Istanbul Avrupa
        fetch_format: html
        covers: [theatre, live_music, opera, comedy, dancing_events]
        last_fetched: null
        last_fetch_status: null
# V1 acknowledges parsing brittleness honestly. When a fetch fails:
# 1. Lyra logs to memories-autonomous-log.md ## fetch-failures
# 2. Surfaces gap in *weekly-plan / *find output ("Smalls site fetch failed — manual paste from you would help")
# 3. Maerg can manually paste activity listings; Lyra incorporates into recommendation pool
#
# V2 = API integrations (more reliable structured data). Each API integration is its own auth + payment surface
# and ships in a dedicated *evolve-agent ADR cycle — not pre-built.
