# Lyra Discovery Sources — curated source URLs for activity discovery
# Per L5 + Q6 lock: V1 = Maerg-curated source list + light web-fetch automation per *weekly-plan / *find.
# V2 = canonical API integrations (Eventbrite, Resy, OpenTable, Ticketmaster, museum APIs) — own *evolve-agent ADR cycle.
#
# Schema:
#   regions:
#     <region-name>:
#       <category>:
#         - url: <source-url>
#           name: <human-readable name>
#           fetch_format: <html | rss | json>  # parsing hint
#           last_fetched: <ISO date>           # populated by Lyra after web-fetch
#           last_fetch_status: <success | failed | rate-limited>
#
# Maerg adds via *add-source <category> <url>; Lyra fetches via *weekly-plan / *find on cadence.
# Fetch failures log to memories-autonomous-log.md ## fetch-failures.

regions: {} # Empty at v1 spawn — Maerg curates initial sources via *add-source.
